<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>イベントカレンダー</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1f1633;--mut:#7b7391;--pk:#d6458f;--pk2:#fbeef5;--vi:#6d3fd1;--vi2:#f4f0ff;--bg:#faf8fc;--line:#ece6f5;--gr:#f6f5f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
a{color:var(--vi);word-break:break-all}
:focus-visible{outline:3px solid var(--vi);outline-offset:2px}

/* ヘッダー周り（左右配置） */
.hero{height:140px;background:linear-gradient(135deg,#2a1559 0%,#6d3fd1 55%,#d6458f 120%);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:16px;background-size:cover;background-position:center}
.genre-bar{display:flex;gap:8px}
.genre-bar button{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.genre-bar button.active{background:#fff;color:var(--vi);border-color:#fff}

.me{display:flex;align-items:center;gap:6px;font-size:12px}
.me button{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:12px;color:#fff;font-weight:700}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2)!important;padding:4px 10px!important}
.chip .av{margin:0;width:22px;height:22px;font-size:11px}

.cal{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:4;background:var(--bg);margin:-14px -14px 10px;padding:6px 14px 8px;border-bottom:1px solid var(--line)}
.calh{display:flex;justify-content:space-between;align-items:center}
.calh b{font-size:16px}
.calh button{width:44px;height:32px;font-size:24px;color:var(--vi)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wd{font-size:11px;color:var(--mut);padding:2px 0}
.dc{position:relative;height:34px;font-size:14px;font-weight:700;border-radius:10px;color:var(--ink)}
.su{color:#d33}.sa{color:#2a6ad8}
.dc i{position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pk)}
.dc i.g{background:var(--vi)}
.dc.today{background:var(--pk);color:#fff}
.dc.today i{background:#fff}
.dc.sel{outline:2px solid var(--vi)}
.flt{display:flex;justify-content:space-between;align-items:center;background:var(--vi2);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0);z-index:5;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:48px;padding:0;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pk);border-color:var(--pk)}
.wrap{padding:14px 14px 0;max-width:640px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px}
.bar select{width:auto;padding:6px 10px}

/* スワイプアクション */
.swipe-wrap{position:relative;overflow:hidden;border-radius:18px;margin-bottom:14px;background:#95a5a6}
.swipe-wrap.is-hid{background:var(--vi)}
.swipe-action{position:absolute;right:0;top:0;bottom:0;width:100px;background:#95a5a6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;z-index:1;cursor:pointer}
.swipe-wrap.is-hid .swipe-action{background:var(--vi)}

.card{position:relative;z-index:2;background:#fff;border-radius:18px;padding:16px;margin-bottom:0;box-shadow:0 2px 14px rgba(70,40,120,.07);transition:transform 0.25s ease}
.card.swiped{transform:translateX(-100px)}
.card.hid{background:#f0edf6;color:#8e83a6}
.card.hid .mut{color:#aba2be}
.card.hid b{color:#8e83a6!important}

.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.grow{flex:1;min-width:0}
h3{margin:0;font-size:19px;font-weight:800;line-height:1.3}
.mut{color:var(--mut);margin:2px 0 0;font-size:14px}
.th{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line);flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.b{border-radius:12px;padding:8px 10px;background:var(--gr)}
.b small{display:block;font-size:11px;color:var(--mut)}
.b b{font-size:12.5px}
.b.pk{background:var(--pk2)}.b.pk b{color:#8c1d58}
.b.vi{background:var(--vi2)}.b.vi b{color:#47208f}
.wide{grid-column:1/-1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.hint{color:var(--pk);font-size:13px;font-weight:700}
.go{background:var(--pk);color:#fff;font-weight:800;padding:9px 16px;border-radius:99px}
.go.on{background:var(--vi)}
.avs{display:flex;align-items:center;margin-top:10px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--vi);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;margin-right:-8px;flex:none}
.avs span.n{margin-left:16px;font-size:12px;color:var(--mut)}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:50%;background:var(--pk);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(214,69,143,.45);z-index:6}
.num{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:pan-y}
.nb{min-width:92px;text-align:center;border:1.5px solid #dccdf8;background:var(--vi2);border-radius:14px;padding:8px 10px}
.nb small{display:block;font-size:11px;color:var(--vi)}
.nb b{font-size:22px;color:#3b1a82}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.mask{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0))}
.sheet img.big{width:100%;border-radius:14px;margin-bottom:12px}
.sec{border-radius:14px;padding:12px 14px;margin:12px 0}
.sec h4{margin:0 0 6px;font-size:14px}
.sec p{margin:3px 0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;margin-top:10px;text-align:center}
.btn.p{background:var(--pk);color:#fff;border-color:var(--pk)}
.btn.d{color:#c0392b}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth{max-width:420px;margin:0 auto;padding:28px 18px}
.auth h2{font-size:24px;margin:0 0 4px}
.who{display:flex;align-items:center;gap:8px;margin:6px 0}
.who .av{margin:0;border:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const sb = supabase.createClient('https://njzdxjkclaonvtjirrgp.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qemR4amtjbGFvbnZ0amlycmdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzY2NjQsImV4cCI6MjEwODAxMjY2NH0.KkV71ATa8YGN33XJgLtmzJTlsHQkmhoqEAg3bO-wX9U');
let calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=null,siteSettingsMap={},me=null,prof=null,lives=[],ints=[],profs={},nums={},tab='s',sort='d',showHid=false,authMode='in',tx=0,activeSwipeId=null,currentGenre='live';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?esc(u):'';
const link=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
const p2=n=>String(n).padStart(2,'0');
const fd=d=>{if(!d)return'未定';const x=new Date(d+'T00:00:00');return x.getFullYear()+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日('+'日月火水木金土'[x.getDay()]+')'};
const fdt=t=>{if(!t)return'—';const x=new Date(t);return (x.getMonth()+1)+'/'+x.getDate()+' '+p2(x.getHours())+':'+p2(x.getMinutes())};
const loc=t=>{if(!t)return'';const x=new Date(t);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())+'T'+p2(x.getHours())+':'+p2(x.getMinutes())};
const av=p=>p&&safe(p.icon_url)?'<img class="av" src="'+safe(p.icon_url)+'" alt="">':'<span class="av">'+esc(((p&&p.username)||'?').slice(0,1))+'</span>';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const closeM=()=>$('#mask').classList.remove('on');
const openM=h=>{$('#sheet').innerHTML=h;$('#mask').classList.add('on')};
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM()});

function authView(){
 const up=authMode==='up';
 $('#app').innerHTML='<div class="auth"><h2>カレンダーログイン</h2>'
 +(up?'<label>招待コード（合言葉）</label><input id="code" placeholder="幹事に確認してください">'
 +'<label>ユーザー名（みんなに表示されます）</label><input id="un" maxlength="20">':'')
 +'<label>メールアドレス</label><input id="em" type="email" autocomplete="email"><label>パスワード（6文字以上）</label><input id="pw" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'
 +'<button class="btn p" onclick="doAuth()">'+(up?'登録する':'ログイン')+'</button>'
 +'<button class="btn" onclick="authMode=\''+(up?'in':'up')+'\';authView()">'+(up?'ログイン画面へ':'新しく登録する')+'</button></div>';
}
async function doAuth(){
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||!password)return toast('メールとパスワードを入力してください');
 let r;
 if(authMode==='up'){
  const code=$('#code').value.trim();
  if(!code)return toast('招待コードを入力してください');
  const check=await sb.from('invitation_codes').select('code').eq('code',code).maybeSingle();
  if(!check.data)return toast('招待コードが違います');
  const username=$('#un').value.trim()||'名無し';
  r=await sb.auth.signUp({email,password,options:{data:{username,icon_url:null}}});
  if(!r.error&&!r.data.session)return toast('確認メールを送信しました。メール内のリンクを開いてください');
 }else r=await sb.auth.signInWithPassword({email,password});
 if(r.error)toast('失敗: '+r.error.message);
}
async function load(){
 const q=await Promise.all([
  sb.from('lives').select('*'),
  sb.from('interests').select('*'),
  sb.from('profiles').select('*'),
  sb.from('my_numbers').select('*'),
  sb.from('site_settings').select('*')
 ]);
 lives=q[0].data||[];
 ints=q[1].data||[];
 profs={};(q[2].data||[]).forEach(p=>profs[p.id]=p);
 nums={};(q[3].data||[]).forEach(n=>nums[n.live_id]=n);
 prof=profs[me.id]||{};
 
 siteSettingsMap={};
 (q[4].data||[]).forEach(s=>{ siteSettingsMap[s.genre||'live'] = s; });
 render();
}
function getActiveSite(){
 return siteSettingsMap[currentGenre] || {title:'', header_url:''};
}
function sorted(){
 const l=lives.filter(x=>(x.genre||'live')===currentGenre),now=Date.now();
 if(sort==='d')l.sort((a,b)=>(a.live_date||'9999').localeCompare(b.live_date||'9999'));
 else{const f=x=>{if(!x.apply_end)return 9e15;const t=new Date(x.apply_end).getTime();return t<now?1e15+t:t};l.sort((a,b)=>f(a)-f(b))}
 return l;
}
function render(){
 const host=prof&&prof.is_host;
 const site=getActiveSite();
 const hb=safe(site.header_url)?' style="background-image:linear-gradient(rgba(20,10,40,.1),rgba(20,10,40,.55)),url(\''+safe(site.header_url)+'\')"':'';
 
 let h='<div class="hero"'+hb+'>'
 +'<div class="genre-bar"><button class="'+(currentGenre==='live'?'active':'')+'" onclick="currentGenre=\'live\';selDate=null;render()">ライブ</button><button class="'+(currentGenre==='comedy'?'active':'')+'" onclick="currentGenre=\'comedy\';selDate=null;render()">お笑い</button></div>'
 +'<div class="me"><button class="chip" onclick="myPage()">'+av(prof)+esc(prof&&prof.username)+'</button>'+(host?'<button onclick="siteM()">設定</button>':'')+'</div>'
 +'</div>';

 h+='<div class="tabs"><button class="'+(tab==='s'?'on':'')+'" onclick="tab=\'s\';render()">スケジュール</button><button class="'+(tab==='n'?'on':'')+'" onclick="tab=\'n\';render()">整理番号</button></div><div class="wrap">';
 h+=tab==='s'?schedView():numView();
 h+='</div>'+(host&&tab==='s'?'<button class="fab" aria-label="イベントを追加" onclick="formM()">+</button>':'');
 $('#app').innerHTML=h;
}
function calView(){
 const y=calY,m=calM,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const t=new Date(),ts=t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());
 const my=new Set(ints.filter(i=>i.user_id===me.id).map(i=>i.live_id));
 const filteredLives=lives.filter(x=>(x.genre||'live')===currentGenre);
 let c='<div class="cal"><div class="calh"><button aria-label="前の月" onclick="calMove(-1)">‹</button><b>'+y+'年'+(m+1)+'月</b><button aria-label="次の月" onclick="calMove(1)">›</button></div><div class="cg">';
 '日月火水木金土'.split('').forEach((w,i)=>{c+='<span class="wd '+(i===0?'su':i===6?'sa':'')+'">'+w+'</span>'});
 for(let i=0;i<first;i++)c+='<span></span>';
 for(let d=1;d<=days;d++){
  const ds=y+'-'+p2(m+1)+'-'+p2(d),dow=(first+d-1)%7,ls=filteredLives.filter(l=>l.live_date===ds),go=ls.some(l=>my.has(l.id));
  c+='<button class="dc '+(dow===0?'su':dow===6?'sa':'')+(ds===ts?' today':'')+(ds===selDate?' sel':'')+'" onclick="pickDate(\''+ds+'\')">'+d+(ls.length?'<i class="'+(go?'g':'')+'"></i>':'')+'</button>';
 }
 return c+'</div></div>';
}
function calMove(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render()}
function pickDate(ds){selDate=selDate===ds?null:ds;render()}
function schedView(){
 let arr=sorted();if(selDate)arr=arr.filter(l=>l.live_date===selDate);
 let h=calView()+(selDate?'<div class="flt"><span>'+fd(selDate)+' の予定</span><button class="hint" onclick="selDate=null;render()">解除</button></div>':'')
 +'<div class="bar"><b>'+arr.length+'件</b><select onchange="sort=this.value;render()"><option value="d"'+(sort==='d'?' selected':'')+'>日付順</option><option value="a"'+(sort==='a'?' selected':'')+'>申込順（締切が近い順）</option></select></div>';
 if(!arr.length)return h+'<div class="empty">'+(selDate?'この日の予定はありません。':'まだ予定がありません。<br>ホストが追加すると、ここに表示されます。')+'</div>';
 return h+arr.map(card).join('');
}
function card(l){
 const who=ints.filter(i=>i.live_id===l.id),on=who.some(i=>i.user_id===me.id);
 
 return '<div class="card" onclick="detail(\''+l.id+'\')"><div class="row"><div class="grow"><h3>'+esc(l.title)+'</h3><p class="mut">📍 '+esc(l.venue||'会場未定')+'</p></div>'+(safe(l.image_url)?'<img class="th" src="'+safe(l.image_url)+'" alt="">':'')+'</div>'
 +'<div class="grid">'
 +'<div class="b pk"><small>開催日</small><b>'+fd(l.live_date)+'</b></div><div class="b vi"><small>チケット種別</small><b>'+esc(l.ticket_type||'—')+'</b></div><div class="b wide"><small>申込受付期間</small><b>'+fdt(l.apply_start)+' 〜 '+fdt(l.apply_end)+'</b></div><div class="b"><small>当落発表</small><b>'+fd(l.result_date)+'</b></div><div class="b"><small>発券開始</small><b>'+fd(l.issue_date)+'</b></div>'
 +'</div>'
 +(who.length?'<div class="avs">'+who.slice(0,6).map(i=>av(profs[i.user_id])).join('')+'<span class="n">'+who.length+'人が行くかも</span></div>':'')
 +'<div class="foot" style="margin-top:10px"><span class="hint">ⓘ タップで詳細</span><button class="go'+(on?' on':'')+'" onclick="toggleGo(event,\''+l.id+'\')">'+(on?'行くかも！ ✓':'行くかも！')+'</button></div></div>';
}
async function toggleGo(e,id){
 e.stopPropagation();
 const on=ints.some(i=>i.live_id===id&&i.user_id===me.id);
 const r=on?await sb.from('interests').delete().match({live_id:id,user_id:me.id}):await sb.from('interests').insert({live_id:id,user_id:me.id});
 if(r.error)return toast('失敗: '+r.error.message);
 await load();if($('#mask').classList.contains('on'))detail(id);
}
function detail(id){
 const l=lives.find(x=>x.id===id);if(!l)return;
 const who=ints.filter(i=>i.live_id===id),on=who.some(i=>i.user_id===me.id),host=prof&&prof.is_host;

 openM((safe(l.image_url)?'<img class="big" src="'+safe(l.image_url)+'" alt="">':'')+'<h3 style="font-size:22px">'+esc(l.title)+'</h3>'
 +(l.venue?'<p class="mut">📍 '+(safe(l.map_url)?'<a href="'+safe(l.map_url)+'" target="_blank" rel="noopener">'+esc(l.venue)+'</a>':esc(l.venue))+'</p>':'')
 +'<div class="sec" style="background:var(--pk2)"><h4>イベント情報</h4><p>開催日: <b>'+fd(l.live_date)+'</b></p><p>OPEN '+esc(l.open_time||'—')+' / START '+esc(l.start_time||'—')+'</p><p>形式: '+esc(l.format||'—')+'</p></div>'
 +'<div class="sec" style="background:var(--vi2)"><h4>チケット情報</h4><p>種別: '+esc(l.ticket_type||'—')+'</p><p>申込受付: '+fdt(l.apply_start)+' 〜 '+fdt(l.apply_end)+'</p><p>当落発表: '+fd(l.result_date)+'</p><p>発券開始: '+fd(l.issue_date)+'</p></div>'
 +(l.memo?'<div class="sec" style="background:var(--gr)"><h4>メモ</h4><p>'+link(l.memo)+'</p></div>':'')
 +(l.setlist?'<div class="sec" style="background:var(--gr)"><h4>'+(l.genre==='comedy'?'内容メモ':'セトリ')+'</h4><p>'+link(l.setlist)+'</p></div>':'')
 +'<div class="sec" style="background:var(--gr)"><h4>行くかも！リスト（'+who.length+'人）</h4>'+(who.length?who.map(i=>'<div class="who">'+av(profs[i.user_id])+esc((profs[i.user_id]||{}).username)+'</div>').join(''):'<p class="mut">まだ誰もいません</p>')+'</div><button class="btn p" onclick="toggleGo(event,\''+id+'\')">'+(on?'行くかも！を取り消す':'行くかも！')+'</button>'
 +(host?'<button class="btn" onclick="formM(\''+id+'\')">編集</button><button class="btn d" onclick="delLive(\''+id+'\')">削除</button>':'')
 +'<button class="btn" onclick="closeM()">閉じる</button>');
}
function formM(id){
 const l=lives.find(x=>x.id===id)||{};const v=k=>esc(l[k]||'');
 const g = id ? (l.genre || 'live') : currentGenre;
 const isLive = (g === 'live');

 const f=(k,t,lab,ph)=>'<label>'+lab+'</label><input id="f_'+k+'" type="'+t+'" value="'+(t==='datetime-local'?esc(loc(l[k])):v(k))+'"'+(ph?' placeholder="'+ph+'"':'')+'>';
 
 let titleText = id ? 'イベントを編集' : (isLive ? 'ライブを追加' : 'お笑いライブを追加');
 let formats = isLive ? ['主催','対バン','フェス'] : ['単独ライブ','ライブ・寄席','主催','対バン'];
 let ticketPh = isLive ? 'ローチケ など' : 'FANYなど';

 let h = '<h3>'+titleText+'</h3>'
    +  f('title','text','公演名（必須）')
    +  f('venue','text','会場名')
    +  f('map_url','url','マップURL','https://')
    +  f('image_url','url','画像URL（フライヤーなど）','https://')
    +  f('live_date','date','公演日')
    +  '<div class="two"><div>'+f('open_time','time','OPEN')+'</div><div>'+f('start_time','time','START')+'</div></div>'
    +  '<label>ライブ形式</label><select id="f_format"><option value="">選択なし</option>'+formats.map(o=>'<option'+(l.format===o?' selected':'')+'>'+o+'</option>').join('')+'</select>'
    +  f('ticket_type','text','チケット種別',ticketPh)
    +  f('apply_start','datetime-local','申込開始')
    +  f('apply_end','datetime-local','申込締切')
    +  f('result_date','date','当落発表日')
    +  f('issue_date','date','発券開始日')
    +  '<label>メモ（URLは自動でリンクになります）</label><textarea id="f_memo">'+v('memo')+'</textarea>'
    +  '<label>'+(isLive ? 'セトリ' : '内容メモ')+'</label><textarea id="f_setlist">'+v('setlist')+'</textarea>'
    +  '<button class="btn p" onclick="saveLive(\''+(id||'')+'\',\''+g+'\')">保存する</button><button class="btn" onclick="closeM()">キャンセル</button>';

 openM(h);
}

async function saveLive(id, genre){
 const getv=k=>{
  const el=$('#f_'+k);
  if(!el) return null;
  const val = el.value.trim();
  return val === '' ? null : val;
 };
 
 const o={genre: genre};

 o.title=getv('title');
 if(!o.title)return toast('公演名は必須です');

 o.venue=getv('venue');
 o.map_url=getv('map_url');
 o.image_url=getv('image_url');
 o.memo=getv('memo');
 o.setlist=getv('setlist');
 o.live_date=getv('live_date');
 o.open_time=getv('open_time');
 o.start_time=getv('start_time');
 o.format=getv('format');
 o.ticket_type=getv('ticket_type');

 ['apply_start','apply_end'].forEach(k=>{const x=getv(k);o[k]=x?new Date(x).toISOString():null});
 ['result_date','issue_date'].forEach(k=>{o[k]=getv(k);});

 const r=id?await sb.from('lives').update(o).eq('id',id):await sb.from('lives').insert(o);
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();toast('保存しました');load();
}
async function delLive(id){
 if(!confirm('このイベントを削除します。よろしいですか？'))return;
 const r=await sb.from('lives').delete().eq('id',id);
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();load();
}
function numView(){
 const l=sorted0().filter(x=>showHid||!(nums[x.id]&&nums[x.id].hidden));
 let h='<div class="bar"><b>整理番号リスト</b><button class="hint" onclick="showHid=!showHid;render()">'+(showHid?'非表示を隠す':'非表示も表示')+'</button></div><p class="mut" style="margin-top:-6px">番号はあなただけに表示されます。行かないライブは左にスワイプで非表示にできます。</p>';
 if(!l.length)return h+'<div class="empty">表示できるイベントがありません。</div>';
 return h+l.map(x=>{
  const n=nums[x.id]||{};const hd=n.hidden;
  const isSwiped=activeSwipeId===x.id;
  return '<div class="swipe-wrap'+(hd?' is-hid':'')+'">'
   +'<div class="swipe-action" ontouchend="setHid(\''+x.id+'\','+!hd+');event.stopPropagation()" onclick="setHid(\''+x.id+'\','+!hd+')">'+(hd?'表示':'非表示')+'</div>'
   +'<div class="card num'+(hd?' hid':'')+(isSwiped?' swiped':'')+'" ontouchstart="tx=event.touches[0].clientX" ontouchend="swipe(event,\''+x.id+'\')" onclick="if(activeSwipeId===\''+x.id+'\'){activeSwipeId=null;render()}else{numM(\''+x.id+'\')}">'
   +'<div class="grow"><b style="color:var(--pk)">'+fd(x.live_date)+'</b><h3 style="font-size:17px">'+esc(x.title)+'</h3><p class="mut">📍 '+esc(x.venue||'会場未定')+'</p></div>'
   +'<div class="nb"><small>整理番号 / 座席</small><b>'+esc(n.number||'—')+'</b></div>'
   +'</div></div>';
 }).join('');
}
function sorted0(){
 return lives.filter(x=>(x.genre||'live')===currentGenre).sort((a,b)=>(a.live_date||'9999').localeCompare(b.live_date||'9999'));
}
function swipe(e,id){
 if(e.changedTouches[0].clientX-tx<-40){
  activeSwipeId=id;render();
 }else if(e.changedTouches[0].clientX-tx>40&&activeSwipeId===id){
  activeSwipeId=null;render();
 }
}
async function setHid(id,v){
 activeSwipeId=null;
 const r=await sb.from('my_numbers').upsert({live_id:id,user_id:me.id,hidden:v});
 if(r.error)return toast('失敗: '+r.error.message);
 load();
}
function numM(id){
 if(activeSwipeId){activeSwipeId=null;render();return;}
 const l=lives.find(x=>x.id===id),n=nums[id]||{};
 openM('<h3>'+esc(l.title)+'</h3><p class="mut">'+fd(l.live_date)+' / '+esc(l.venue||'')+'</p><label>整理番号 / 座席（あなただけに表示されます）</label><input id="nv" value="'+esc(n.number||'')+'" inputmode="text">'
 +'<button class="btn p" onclick="saveNum(\''+id+'\')">保存する</button><button class="btn" onclick="closeM()">キャンセル</button>');
}
async function saveNum(id){
 const v=$('#nv').value.trim()||null;
 const r=await sb.from('my_numbers').upsert({live_id:id,user_id:me.id,number:v});
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();load();
}
function myPage(){
 openM('<h3>マイページ</h3><div class="who">'+av(prof)+'<b>'+esc(prof.username)+'</b></div>'
 +'<label>ユーザー名</label><input id="mu" maxlength="20" value="'+esc(prof.username)+'">'
 +'<label>プロフィール画像（タップして写真を選択）</label><input id="mfile" type="file" accept="image/*">'
 +'<button class="btn p" onclick="saveMe()">プロフィールを保存</button>'
 +'<label>メールアドレス</label><input id="me_" type="email" value="'+esc(me.email)+'">'
 +'<button class="btn" onclick="saveEmail()">メールアドレスを変更</button>'
 +'<label>新しいパスワード（6文字以上）</label><input id="np" type="password" autocomplete="new-password">'
 +'<button class="btn" onclick="savePw()">パスワードを変更</button>'
 +'<button class="btn d" onclick="closeM();sb.auth.signOut()">ログアウト</button><button class="btn" onclick="closeM()">閉じる</button>');
}
function resizeImg(file){
 return new Promise((res,rej)=>{
  const img=new Image(),reader=new FileReader();
  reader.onload=e=>img.src=e.target.result;
  reader.onerror=rej;
  img.onload=()=>{
   const canvas=document.createElement('canvas');
   let w=img.width,h=img.height,max=300;
   if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   canvas.toBlob(b=>res(b),'image/jpeg',0.85);
  };
  reader.readAsDataURL(file);
 });
}
async function saveMe(){
 const username=$('#mu').value.trim()||'名無し';
 let icon_url=prof.icon_url||null;
 const fileInput=$('#mfile');
 if(fileInput.files&&fileInput.files[0]){
  toast('画像を圧縮してアップロード中...');
  try{
   const blob=await resizeImg(fileInput.files[0]);
   const path=me.id+'.jpg';
   const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(up.error)return toast('画像失敗: '+up.error.message);
   const pub=sb.storage.from('avatars').getPublicUrl(path);
   icon_url=pub.data.publicUrl+'?v='+Date.now();
  }catch(err){return toast('画像処理に失敗しました')}
 }
 const r=await sb.from('profiles').update({username,icon_url}).eq('id',me.id);
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();toast('保存しました');load();
}
async function saveEmail(){
 const e=$('#me_').value.trim();
 if(!e||e===me.email)return toast('新しいメールアドレスを入力してください');
 const r=await sb.auth.updateUser({email:e});
 if(r.error)return toast('失敗: '+r.error.message);
 toast('変更しました。確認メールが届いた場合はリンクを開いてください');
}
async function savePw(){
 const p=$('#np').value;
 if(p.length<6)return toast('6文字以上で入力してください');
 const r=await sb.auth.updateUser({password:p});
 if(r.error)return toast('失敗: '+r.error.message);
 $('#np').value='';toast('パスワードを変更しました');
}
function siteM(){
 const site=getActiveSite();
 openM('<h3>サイト設定 ('+(currentGenre==='live'?'ライブ':'お笑い')+')</h3>'
 +'<label>ヘッダー画像（タップして写真を選択）</label><input id="sfile" type="file" accept="image/*">'
 +'<button class="btn p" onclick="saveSite()">保存する</button><button class="btn" onclick="closeM()">キャンセル</button>');
}
async function saveSite(){
 const site=getActiveSite();
 let header_url=site.header_url||null;
 const fileInput=$('#sfile');
 if(fileInput.files&&fileInput.files[0]){
  toast('画像を圧縮してアップロード中...');
  try{
   // ヘッダー画像用に少し大きめのサイズ（max=1200pxなど）か、マイページと同じ共通関数でリサイズ
   const blob=await resizeImgForHeader(fileInput.files[0]);
   const path='header_'+currentGenre+'.jpg';
   const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(up.error)return toast('画像失敗: '+up.error.message);
   const pub=sb.storage.from('avatars'.replace('avatars','avatars')); // バケット名は既存のavatarsを利用
   const pubUrlObj=sb.storage.from('avatars').getPublicUrl(path);
   header_url=pubUrlObj.data.publicUrl+'?v='+Date.now();
  }catch(err){return toast('画像処理に失敗しました')}
 }
 const r=await sb.from('site_settings').upsert({
  genre: currentGenre,
  title: '',
  header_url: header_url
 }, {onConflict: 'genre'});
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();toast('保存しました');load();
}

// ヘッダー用リサイズ（少し大きめの1200pxに調整）
function resizeImgForHeader(file){
 return new Promise((res,rej)=>{
  const img=new Image(),reader=new FileReader();
  reader.onload=e=>img.src=e.target.result;
  reader.onerror=rej;
  img.onload=()=>{
   const canvas=document.createElement('canvas');
   let w=img.width,h=img.height,max=1200;
   if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   canvas.toBlob(b=>res(b),'image/jpeg',0.9);
  };
  reader.readAsDataURL(file);
 });
}

sb.auth.onAuthStateChange((ev,s)=>{
 if(s&&s.user){me=s.user;setTimeout(load,0)}else{me=null;authView()}
});
</script>
